# alias /usr/local/etc/nginx/conf.d/neuravoicedemo_local.conf

upstream quantz_uwsgi {
  server unix:/tmp/uwsgi.sock;
}

server {
  listen 8000;
  server_name localhost;
  charset utf-8;

  # kill cache
  add_header Last-Modified $date_gmt;
  add_header Cache-Control 'private no-store, no-cache, must-revalidate,  proxy-revalidate, max-age=0';
  if_modified_since off;
  expires off;
  etag off;

  client_max_body_size 75M;

  location / {
    include uwsgi_params;
    uwsgi_pass quantz_uwsgi;
  }

  # static
  location = /favicon.ico {
    alias /Users/K00TSUKA/Sources/quantz/web-server/favicon.ico;
  }
  location = /robots.txt {
    alias /Users/K00TSUKA/Sources/quantz/web-server/robots.txt;
  }
  location = /sitemap.xml {
    alias /Users/K00TSUKA/Sources/quantz/web-server/sitemap.xml;
  }
  location /img/ {
    root /Users/K00TSUKA/Sources/quantz/web-server/views/;
  }
  location /js/ {
    root /Users/K00TSUKA/Sources/quantz/web-server/views/;
  }
  location /css/ {
    root /Users/K00TSUKA/Sources/quantz/web-server/views/;
  }
  location /video/ {
    root /Users/K00TSUKA/Sources/quantz/web-server/views/;
  }
  location /fonts/ {
    root /Users/K00TSUKA/Sources/quantz/web-server/views/;
  }
  location /node_modules/ {
    root /Users/K00TSUKA/Sources/quantz/web-server/views/;
  }
  location /documents/ {
    root /Users/K00TSUKA/Sources/quantz/web-server/views/;
  }
}