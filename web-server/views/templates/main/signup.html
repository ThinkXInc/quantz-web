{% extends "general/common.html" %}
{% block content %}
<section id="signup">
</section>
<script>
{
    const lang = "{{ lang }}"
    const langName = "{{ lang_name }}"

    const freeCall = "{{ free_call }}"
    const unitPrice = "{{ unit_price }}"

    const localeDict = {{ locale_json | safe }};
    if (!localeDict) {
        console.error('locale_json not received.');
    }
    const locale = new Locale(localeDict);

    console.log(locale);

    window.locale = locale;
    window.lang = lang;
    window.langName = langName;

    window.freeCall = freeCall;
    window.unitPrice = unitPrice;
}
</script>
<script src="https://js.stripe.com/v3/"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src=/js/helpers/googleoauth.js></script>
<script src=/js/view_components/card_input.js></script>
<script src=/js/view_controllers/signup.js></script>
{% endblock %}
