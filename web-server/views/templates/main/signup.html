{% extends "general/common.html" %}
{% block content %}
<section id="signup">
</section>
<script>
{
    // Q-5c: PAGE_DATA 単一注入規約。個別スカラ注入を1つの dict に集約する。
    const PAGE_DATA = {{ page_data | tojson }};
    window.PAGE_DATA = PAGE_DATA;

    const localeDict = PAGE_DATA.localeDict;
    if (!localeDict) {
        console.error('localeDict not received.');
    }
    const locale = new Locale(localeDict);

    console.log(locale);

    // 既存の window.* 参照(他ビュー含む)を壊さないためブリッジを維持。値は PAGE_DATA 由来。
    window.locale = locale;
    window.lang = PAGE_DATA.lang;
    window.langName = PAGE_DATA.langName;

    window.freeCall = parseInt(PAGE_DATA.freeCall);
    window.unitPrice = parseFloat(PAGE_DATA.unitPrice);
    window.generalCreditPerResponse = parseInt(PAGE_DATA.generalCreditPerResponse);
    window.interviewCreditPerResponse = parseInt(PAGE_DATA.interviewCreditPerResponse);
}
</script>
<script src="https://js.stripe.com/v3/"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src=/js/helpers/googleoauth.js></script>
<script src=/js/view_components/card_input.js></script>
<script src=/js/view_controllers/signup.js></script>
{% endblock %}
