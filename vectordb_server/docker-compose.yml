version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:management
    hostname: rabbitmq-web
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"  # RabbitMQ service
      - "15672:15672"  # RabbitMQ management interface
    networks:
      - backend

  redis:
    image: redis:latest
    hostname: redis-results-web
    command: redis-server --requirepass guest --loglevel debug
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    environment:
      REDIS_DATABASES: 0
    networks:
      - backend

networks:
  backend:

volumes:
  redis_data:
