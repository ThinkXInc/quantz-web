<svg width="50px" height="50px" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
    <!-- Define an invisible large circle (for reference) -->
    <circle cx="25" cy="25" r="15" fill="none" />

    <!-- Small circle 1 -->
    <circle cx="25" cy="40" r="3" fill="#808080">
        <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="2.5s" repeatCount="indefinite" />
    </circle>

    <!-- Small circle 2 -->
    <circle cx="25" cy="40" r="3" fill="#808080">
        <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="2s" repeatCount="indefinite" />
    </circle>

    <!-- Small circle 3 -->
    <circle cx="25" cy="40" r="3" fill="#808080">
        <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1.5s" repeatCount="indefinite" />
    </circle>

    <!-- Small circle 4 -->
    <circle cx="25" cy="40" r="3" fill="#808080">
        <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="3s" repeatCount="indefinite" />
    </circle>

    <!-- Small circle 5 -->
    <circle cx="25" cy="40" r="3" fill="#808080">
        <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="3.5s" repeatCount="indefinite" />
    </circle>
</svg>
